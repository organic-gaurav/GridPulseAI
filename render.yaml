services:
  - type: web
    name: gridpulse-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        value: https://gridpulse-frontend-syg7.onrender.com
      - key: GRIDPULSE_API_TOKEN
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./gridpulse.db
      - key: SIM_TICK_SECONDS
        value: "3.0"
      - key: LATITUDE
        value: "51.5074"
      - key: LONGITUDE
        value: "-0.1278"
      - key: CARBON_PROVIDER
        value: uk_carbon

  - type: web
    name: gridpulse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://gridpulse-backend-syg7.onrender.com wss://gridpulse-backend-syg7.onrender.com; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gridpulse-backend
          envVarKey: RENDER_EXTERNAL_URL
